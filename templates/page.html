<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canopy · Iron Forest visibility</title>
  <link rel="stylesheet" href="/static/canopy.css">
</head>
<body>
  <div class="app-shell">
    {{template "fleet.html" .}}
    <main class="page-content" id="main-content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Read-only operations surface</p>
          <h1>Canopy</h1>
          <p class="lede">A quiet, external view of the work your Iron Forest instances are doing now and what they last proved.</p>
        </div>
        <p class="muted mono">forest.cli.v2</p>
      </header>
      {{template "instance.html" .Selected}}
    </main>
  </div>
  <div id="log-drawer" class="log-drawer" role="dialog" aria-modal="true" aria-labelledby="log-drawer-title" hidden>
    <div class="log-drawer-backdrop" data-log-close aria-hidden="true"></div>
    <section class="log-drawer-panel" aria-label="Run log viewer">
      <header class="log-drawer-header">
        <h2 id="log-drawer-title">Run log</h2>
        <button type="button" class="log-drawer-close" data-log-close aria-label="Close log viewer">Close</button>
      </header>
      <div id="log-drawer-body" class="log-drawer-body"></div>
    </section>
  </div>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/canopy.js" defer></script>
</body>
</html>
